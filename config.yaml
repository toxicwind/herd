# =============================================================================
# LLAMA-SWAP CONFIGURATION — Dynamic Auto-Discovery Edition
# =============================================================================
# This config is GENERATED by autoscan. Do not edit manually.
# Run: /home/toxic/sovereign/scripts/llama-swap-autoscan.sh
# =============================================================================

healthCheckTimeout: 300
logLevel: debug
logToStdout: both
metricsMaxInMemory: 5000
captureBuffer: 15
globalTTL: 600
startPort: 25001
includeAliasesInList: true
sendLoadingState: true

store:
  path: /home/toxic/.local/share/llama-swap/store.db

performance:
  enable: true
  every: 1m

hooks:
  on_startup:
    preload:
      - beellama/exaone-4-0-1-2b-iq4xs
  on_model_loaded:
    exec: 'echo "[$(date)] MODEL_LOADED: $MODEL" >> /tmp/llama-swap-events.log'
  on_model_unloaded:
    exec: 'echo "[$(date)] MODEL_UNLOADED: $MODEL" >> /tmp/llama-swap-events.log'

# -----------------------------------------------------------------------------
# ROUTING MATRIX (auto-populated by autoscan)
# -----------------------------------------------------------------------------
routing:
  scheduler:
    use: fifo
    settings:
      fifo:
        priority: {}
  router:
    use: matrix
    settings:
      matrix:
        vars: {}
        evict_costs: {}
        sets:
          exclusive: ""

# -----------------------------------------------------------------------------
# MACROS — Auto-discovered paths
# -----------------------------------------------------------------------------
macros:
  # Model directories (scanned by autoscan)
  MODEL_DIR: /home/toxic/projects/models
  HF_CACHE_DIR: /home/toxic/.cache/huggingface/hub

  # Fork binaries (auto-detected)
  BEELLAMA_BIN: /home/toxic/projects/sovereign-projects/herd/engines/beellama.cpp/build-cuda86/bin/llama-server
  TURBO_BIN: /home/toxic/projects/sovereign-projects/herd/engines/llama-cpp-turboquant/build/bin/llama-server
  IK_BIN: /home/toxic/projects/sovereign-projects/herd/engines/ik_llama.cpp/build/bin/llama-server
  IK_TQ_BIN: /home/toxic/projects/sovereign-projects/herd/engines/ik_llama.cpp/build_turboquant/bin/llama-server

  # LD_LIBRARY_PATH for each fork
  BEELLAMA_LD: /home/toxic/projects/sovereign-projects/herd/engines/beellama.cpp/build-cuda86/bin
  TURBO_LD: /home/toxic/projects/sovereign-projects/herd/engines/llama-cpp-turboquant/build/bin
  IK_LD: /home/toxic/projects/sovereign-projects/herd/engines/ik_llama.cpp/build/src:/home/toxic/projects/sovereign-projects/herd/engines/ik_llama.cpp/build/ggml/src:/home/toxic/projects/sovereign-projects/herd/engines/ik_llama.cpp/build/examples/mtmd
  IK_TQ_LD: /home/toxic/projects/ik_turboquant/build/src:/home/toxic/projects/ik_turboquant/ggml/src:/home/toxic/projects/ik_turboquant/examples/mtmd

  # CUDA ENV
  CUDA_ENV: CUDA_VISIBLE_DEVICES=0 GGML_CUDA=1 GGML_CUDA_GRAPHS=1 GGML_CUDA_FA_ALL_QUANTS=1

  # Server base
  SRV_HOST: --host 127.0.0.1
  SRV_PORT: --port ${PORT}
  SRV_HOST_PORT: ${SRV_HOST} ${SRV_PORT}
  SRV_GPU_LAYERS: --n-gpu-layers all
  IK_GPU_LAYERS: -ngl 99
  SRV_FA: --flash-attn on
  SRV_GPU: ${SRV_GPU_LAYERS} ${SRV_FA}
  SRV_PARALLEL: --parallel 1
  SRV_METRICS: --metrics
  SRV_MLOCK: --mlock
  SRV_NOMMAP: --no-mmap
  SRV_SAFETY: ${SRV_PARALLEL} ${SRV_METRICS} ${SRV_MLOCK} ${SRV_NOMMAP}
  SRV_BASE: ${SRV_HOST_PORT} ${SRV_GPU} ${SRV_SAFETY}

  # Fork-specific flags
  FORK_BEELLAMA: --kv-unified --no-host --cache-ram 0
  FORK_TURBO: --no-warmup
  FORK_IK: --fit --fit-margin 512 --no-warmup --defrag-thold 0.1
  SRV_IK_BASE: ${SRV_HOST_PORT} ${IK_GPU_LAYERS} ${SRV_FA} ${SRV_SAFETY}
  SRV_IKTQ_BASE: ${SRV_HOST_PORT} ${IK_GPU_LAYERS} ${SRV_FA} ${SRV_SAFETY}

  # KV Cache Types
  KV_Q8: --cache-type-k q8_0 --cache-type-v q8_0
  KV_TURBO3: --cache-type-k turbo3 --cache-type-v turbo3
  KV_TURBO3_TCQ: --cache-type-k turbo3_tcq --cache-type-v turbo3_tcq
  KV_PRECISE: --cache-type-k q5_0 --cache-type-v q4_1
  KV_BALANCED: --cache-type-k q4_0 --cache-type-v q4_0

  # Context + Batch
  CS_32K: "32768"
  CS_64K: "65536"
  CS_96K: "98304"
  CS_128K: "131072"
  CS_160K: "163840"
  CS_256K: "262144"

  B_4K: "4096"
  B_2K: "2048"
  B_1K: "1024"
  B_512: "512"
  B_256: "256"

  UB_1K: "1024"
  UB_512: "512"
  UB_256: "256"
  UB_128: "128"
  UB_64: "64"

  CTX_32K: --ctx-size ${CS_32K}  -b ${B_2K}  -ub ${UB_512}
  CTX_64K: --ctx-size ${CS_64K}  -b ${B_2K}  -ub ${UB_512}
  CTX_96K: --ctx-size ${CS_96K}  -b ${B_2K}  -ub ${UB_512}
  CTX_128K: --ctx-size ${CS_128K} -b ${B_2K}  -ub ${UB_512}
  CTX_160K: --ctx-size ${CS_160K} -b ${B_1K}  -ub ${UB_512}
  CTX_256K: --ctx-size ${CS_256K} -b ${B_1K}  -ub ${UB_256}

  # Speculative Decoding
  SPEC_NONE: ""
  SPEC_DRAFT_SIMPLE: --spec-type draft --model-draft ${DRAFT_SMALL}
  SPEC_DRAFT_MTP: --spec-type draft-mtp

  # Reasoning / Sampling
  REASONING_OFF: --reasoning off --reasoning-budget 0 --reasoning-format none
  REASONING_ON: --reasoning on --chat-template-kwargs '{"preserve_thinking":true}'

  SAMP_CODING: --temp 0.2 --top-p 0.95 --top-k 50
  SAMP_CREATIVE: --temp 0.8 --top-p 0.95
  SAMP_GEMMA: --temp 1.0 --top-p 0.95 --top-k 64

