  # See the canonical doctrine block above 'peers:'. (Supersedes the 2026-09-20
  # free-beats-local note: free still beats local, but measured ranking comes first.)
  # MODEL CONSTRAINTS (2026-09-20, herd-surgeon): card-derived per-model
  # request contracts live in config/model_constraints.yaml and are ENFORCED
  # by bin/herd-model-guard.py (127.0.0.1:25101 -> herd :25100). Point Kimi
  # callers at :25101 so top_p=0.95 / reasoning_effort clamp /
  # thinking-always-on apply automatically.
  # KEY POOLS (2026-09-20, herd-deployer): cloud-provider keys rotate through
  # bin/herd-keypool.py (127.0.0.1:25109, config/keypools.yaml) — cheap
  # health probes, first-valid-wins per call, 401/402/429 = routing signal
  # (parked with cooldown, revalidated on demand). Peers below carry NO
  # apiKey where the pool injects auth; do not re-add single hardcoded keys.
  # RE-ENABLED 2026-09-20 ~01:50 MDT (ember): surgeon 401 claim re-probed live --
  # no-auth and dummy-bearer both return HTTP 200 with real completions
  # (kimi-k3 @ 0.24-0.53s, openai @ 0.28s). Free-Kimi route is live;
  # re-probe before disabling. (openrouter-kimi/hf-free/flock disables verified dead.)
  # RE-ENABLED 2026-09-21 (forge): herd rebuilt from sovereign-swap branch
  # herd-fqn-fix commit 7fc25280816f -- the Sep-18 dummy-Bearer workaround is gone:
  # empty apiKey now sends NO auth headers (peer.go strips client auth too).
  # Direct no-auth probe 2026-09-21 returned HTTP 200 on openai; through-herd
  # verification after restart below. Re-park if 401s return.
  pollinations-free:
    proxy: https://gen.pollinations.ai
